name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake (GamificaPampa colours)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2f2a4a&color_dots=#ebedf0,#d5f6ea,#8fd86d,#62c255,#2e7d32
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffd23f&color_dots=#161b22,#1f4d2b,#3a7d3a,#62c255,#8fd86d

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
